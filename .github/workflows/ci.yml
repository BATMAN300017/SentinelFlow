name: SentinelFlow AI CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      APP_ENV: test
      NODE_ENV: test
      DATABASE_URL: sqlite:////tmp/sentinelflow_ci_test.db
      SUPABASE_URL: ""
      SUPABASE_KEY: ""
      POSTGRES_URL: ""
      PGHOST: ""
      PGDATABASE: "test"
      ALLOW_DEMO_SEEDING: "true"
      PYTHONPATH: .

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Database Seeding (Isolated Local Test SQLite DB)
      run: |
        python scripts/seed_demo_data.py

    - name: Execute Automated Test Suite
      run: |
        python backend/tests/run_tests.py

    - name: Test Scenario Simulation (Isolated Local Test SQLite DB)
      run: |
        python scripts/run_demo_scenario.py --scenario rapid_movement
